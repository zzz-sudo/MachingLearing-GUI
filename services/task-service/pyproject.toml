[project]
name = "ml-gui-task-service"
version = "0.1.0"
description = "Local task service for MachingLearing GUI"
authors = [{ name = "Kuroneko" }]
requires-python = ">=3.11,<3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "charset-normalizer>=3.4,<4.0",
  "openpyxl>=3.1,<4.0",
  "python-docx>=1.1,<2.0",
  "pyarrow>=17,<24",
  "pymupdf>=1.24,<2.0",
  "rapidocr>=3.9,<4.0",
  "onnxruntime>=1.18,<2.0",
  "pydantic>=2.9,<3.0",
  "uvicorn>=0.32,<1.0"
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1.0",
  "pytest>=8.3,<9.0"
]
packaging = [
  "pyinstaller>=6.11,<7.0"
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
